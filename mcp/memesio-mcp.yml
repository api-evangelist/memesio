- name: get_template_ideas
  description: Turn a prompt into ranked meme template ideas.
- name: caption_template
  description: Render a hosted meme from a known template slug and caption slots. Watermark customization
    is applied only for premium callers.
- name: caption_upload
  description: Upload an image by URL or base64, render caption slots on top of it, and return a hosted
    meme. Watermark customization is applied only for premium callers.
- name: generate_meme
  description: Select an existing meme template, generate captions, and return one or more meme variants.
- name: generate_gif
  description: Render a downloadable animated meme GIF from an approved GIF template. Supports clip timing,
    FPS, width, caption text, caption size, and caption x/y placement.
- name: get_ai_quota
  description: Read the keyed AI quota before deciding whether to spend a generation run.
