openapi: 3.2.0
info:
  title: Memesio API Contracts AI Captions API
  version: 0.1.0
  description: Contract baseline for AI jobs, trend alerts, collaboration, and billing surfaces.
servers:
- url: /
tags:
- name: ai-captions
paths:
  /api/ai/captions/scene:
    post:
      summary: Run Scene-Understanding Pipeline to Extract Entities, Tone Cues, and Trend…
      tags:
      - ai-captions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - canvasText
              properties:
                canvasText:
                  type: array
                  items:
                    type: string
                templateName:
                  type: string
                templateDescription:
                  type: string
                templateTags:
                  type: array
                  items:
                    type: string
                trendSignals:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Scene understanding payload
        '400':
          description: Validation error
      operationId: postApiAiCaptionsScene
      x-operation-id-source: derived
  /api/ai/captions/tone-presets:
    get:
      summary: List Default + Custom Brand Tone Presets
      tags:
      - ai-captions
      parameters:
      - name: locale
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Tone preset list payload
      operationId: getApiAiCaptionsTonePresets
      x-operation-id-source: derived
    post:
      summary: Create or Update Custom Brand Tone Preset
      tags:
      - ai-captions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                locale:
                  type: string
                voiceRules:
                  type: array
                  items:
                    type: string
                blockedTerms:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Tone preset saved
        '400':
          description: Validation error
      operationId: postApiAiCaptionsTonePresets
      x-operation-id-source: derived
  /api/ai/captions/prompt:
    post:
      summary: Build Caption Prompt with Optional Inferred Scene Context and Locale…
      tags:
      - ai-captions
      responses:
        '200':
          description: Caption prompt payload
        '400':
          description: Validation error
      operationId: postApiAiCaptionsPrompt
      x-operation-id-source: derived
  /api/ai/captions/generate:
    get:
      summary: Read the Current Actor's Daily Caption Reroll Quota and Reset Window
      tags:
      - ai-captions
      security:
      - AgentApiKeyAuth: []
      - {}
      responses:
        '200':
          description: Current actor caption reroll quota snapshot
      operationId: getApiAiCaptionsGenerate
      x-operation-id-source: derived
    post:
      summary: Generate Caption Reroll Options with Locale-Aware Output, Ranking, Inline…
      tags:
      - ai-captions
      security:
      - AgentApiKeyAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tone
              properties:
                tone:
                  type: string
                memeId:
                  type: string
                memeSlug:
                  type: string
                ownerToken:
                  type: string
                sceneSummary:
                  type: string
                entities:
                  type: array
                  items:
                    type: string
                toneCues:
                  type: array
                  items:
                    type: string
                trendReferences:
                  type: array
                  items:
                    type: string
                trendKeywords:
                  type: array
                  items:
                    type: string
                rewriteNote:
                  type: string
                referenceCaptions:
                  type: array
                  items:
                    type: string
                  maxItems: 7
                captionCount:
                  type: integer
                  minimum: 1
                  maximum: 7
                optionCount:
                  type: integer
                  minimum: 1
                  maximum: 5
                variationOffset:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        '200':
          description: Caption generation + ranking payload with reroll quota snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  generationStrategy:
                    type: string
                    enum:
                    - openai
                    - heuristic
                  providerId:
                    type: string
                  fallbackUsed:
                    type: boolean
                  captionSets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                        captions:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
        '400':
          description: Validation error
        '429':
          description: Daily caption reroll quota exceeded
      operationId: postApiAiCaptionsGenerate
      x-operation-id-source: derived
  /api/ai/captions/rewrite:
    post:
      summary: Rewrite Caption Text with Shorten/Punchier/Less-Offensive/Brand-Safe Tools and…
      tags:
      - ai-captions
      security:
      - AgentApiKeyAuth: []
      - {}
      responses:
        '200':
          description: Caption rewrite payload
        '400':
          description: Validation error
      operationId: postApiAiCaptionsRewrite
      x-operation-id-source: derived
  /api/ai/captions/rank:
    post:
      summary: Rank Caption Variants and Return Top Safe Selections
      tags:
      - ai-captions
      responses:
        '200':
          description: Caption ranking payload
        '400':
          description: Validation error
      operationId: postApiAiCaptionsRank
      x-operation-id-source: derived
  /api/ai/captions/moderate:
    post:
      summary: Moderate Caption Candidates with Inline Highlights/Rationale and Enqueue…
      tags:
      - ai-captions
      responses:
        '200':
          description: Caption moderation payload
        '400':
          description: Validation error
      operationId: postApiAiCaptionsModerate
      x-operation-id-source: derived
components:
  securitySchemes:
    DeveloperApiKeyAuth:
      type: apiKey
      in: header
      name: x-developer-api-key
      description: 'Optional higher-rate free-tier auth. You can also send the key as Authorization: Bearer <key>.'
    AgentApiKeyAuth:
      type: apiKey
      in: header
      name: x-agent-api-key
      description: 'Agent auth for free endpoints and agent-admin routes. You can also send the key as Authorization: Bearer <key>.'
