openapi: 3.2.0
info:
  title: Memesio API Contracts Auth API
  version: 0.1.0
  description: Contract baseline for AI jobs, trend alerts, collaboration, and billing surfaces.
servers:
- url: /
tags:
- name: Auth
paths:
  /api/auth/signup:
    post:
      summary: Create Email/Password Account and Send Verification Email
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                displayName:
                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Account created and verification sent
        '400':
          description: Validation error
        '409':
          description: Email already registered
      operationId: postApiAuthSignup
      x-operation-id-source: derived
  /api/auth/resend-verification:
    post:
      summary: Resend Email Verification Link
      tags:
      - Auth
      responses:
        '200':
          description: Verification email sent
        '400':
          description: Validation error
        '404':
          description: Account not found
        '409':
          description: Already verified
      operationId: postApiAuthResendVerification
      x-operation-id-source: derived
components:
  securitySchemes:
    DeveloperApiKeyAuth:
      type: apiKey
      in: header
      name: x-developer-api-key
      description: 'Optional higher-rate free-tier auth. You can also send the key as Authorization: Bearer <key>.'
    AgentApiKeyAuth:
      type: apiKey
      in: header
      name: x-agent-api-key
      description: 'Agent auth for free endpoints and agent-admin routes. You can also send the key as Authorization: Bearer <key>.'
